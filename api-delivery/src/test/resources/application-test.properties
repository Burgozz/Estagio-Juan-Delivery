# Perfil usado apenas pelos testes de integração (@ActiveProfiles("test")).
# Banco H2 em memória: não toca no PostgreSQL de desenvolvimento.
spring.datasource.url=jdbc:h2:mem:api_delivery_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# O admin padrão é inserido por SQL antes do DataInitializer rodar, igual ao
# banco de desenvolvimento (onde ele já existe). Motivo: o DataInitializer cria
# o admin com senha "admin" (5 caracteres) e a entidade exige no mínimo 6, então
# num banco vazio a aplicação não sobe. Ver DataInitializerTest.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:admin-teste.sql
